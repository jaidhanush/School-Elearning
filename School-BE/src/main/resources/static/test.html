<!DOCTYPE html>
<html>
<body>
  <button onclick="pay()">Pay Now</button>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <script>
    function pay() {
      const options = {
        key: "rzp_test_SoKi1RiA00WqLG",   // your key
        amount: 50000,                   // amount in paise (500 = ₹5)
        currency: "INR",
        order_id: "order_StZJBdr7ZfoE4d",

        handler: function (response) {
          console.log("Payment response:", response);

          fetch("http://localhost:8080/api/payment/razorpay/verify", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization":"Bearer "+ "eyJhbGciOiJIUzI1NiJ9.eyJ0eXBlIjoicmVmcmVzaCIsInN1YiI6InJhaHVsQGdtYWlsLmNvbSIsImlhdCI6MTc3OTcwNTI4MCwiZXhwIjoxNzgwMzEwMDgwfQ.m9wmzm55TcfQOjvCpJEk1l-NQySKSVEYieUWtL3RlC4"
            },
            body: JSON.stringify(response)
          })
          .then(r => r.json())
          .then(data => {
            if (data.success) {
              alert("✅ Payment verified! Payment ID: " + data.paymentId);
            } else {
              alert("❌ Verification failed: " + data.error);
            }
          });
        }
      };

      new Razorpay(options).open();
    }
  </script>
</body>
</html>
